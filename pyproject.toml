[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock-analyst-mcp"
version = "0.4.2"
description = "MCP server for Indian stock market analysis — fundamentals, technicals, DCF, peer comparison"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Stock Analyst Contributors" },
]
keywords = ["mcp", "stocks", "india", "nse", "bse", "finance", "analysis", "dcf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "yfinance>=0.2.36",
    "pandas>=2.0.0",
    "pandas-ta>=0.3.14",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "lxml>=5.0.0",
    "mcp>=1.0.0",
    "redis>=5.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
stock-analyst-mcp = "stock_analyst.server:main"
stock-analyst = "stock_analyst.cli:main"

[project.urls]
Homepage = "https://github.com/parth-mehta-989/stock-analyst-mcp"
Repository = "https://github.com/parth-mehta-989/stock-analyst-mcp"
Issues = "https://github.com/parth-mehta-989/stock-analyst-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["stock_analyst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
